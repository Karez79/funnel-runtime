# The same gates as `pnpm check` locally and in the Claude Stop hook, plus e2e.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: every main commit must end with a completed check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The Playwright version is read from the lockfile so the container image always
  # matches @playwright/test; browsers and their system libraries are preinstalled
  # in the image, so CI never runs apt or downloads browsers.
  playwright-version:
    name: playwright version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.pw.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: pnpm-lock.yaml
          sparse-checkout-cone-mode: false
      - id: pw
        run: |
          version="$(grep -oE "^  '?@playwright/test@[0-9]+\.[0-9]+\.[0-9]+" pnpm-lock.yaml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+$')"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e
    needs: playwright-version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
